apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-app-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextjs-app
  template:
    metadata:
      labels:
        app: nextjs-app
    spec:
      containers:
      - name: app
        image: revario/nextjs-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
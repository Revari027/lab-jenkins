apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-app-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextjs-app
  template:
    metadata:
      labels:
        app: nextjs-app
    spec:
      containers:
      - name: app
        image: revario/nextjs-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: nextjs-app-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: nextjs-app
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080